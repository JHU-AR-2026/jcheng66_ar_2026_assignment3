<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Assignment 3 - Q2</title>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
    </style>
</head>

<body>
    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        const createScene = async function () {
            const scene = new BABYLON.Scene(engine);

            // 1. Camera for desktop preview
            const camera = new BABYLON.ArcRotateCamera(
                "camera",
                Math.PI / 2,
                Math.PI / 3,
                4,
                BABYLON.Vector3.Zero(),
                scene
            );
            camera.attachControl(canvas, true);

            // 2. Lighting
            const light = new BABYLON.HemisphericLight(
                "light",
                new BABYLON.Vector3(0, 1, 0),
                scene
            );
            light.intensity = 1.0;

            // 3. Virtual ground for ray hit testing
            const ground = BABYLON.MeshBuilder.CreateGround(
                "ground",
                { width: 10, height: 10 },
                scene
            );
            ground.isPickable = true;

            const groundMaterial = new BABYLON.StandardMaterial(
                "groundMaterial", scene
            );
            groundMaterial.diffuseColor =
                new BABYLON.Color3(0.5, 0.5, 0.5);
            groundMaterial.alpha = 0.3;
            ground.material = groundMaterial;

            // 4. Transparent background for AR
            scene.clearColor = new BABYLON.Color4(0, 0, 0, 0);

            // 5. Track the most recently spawned model
            let latestModel = null;

            // 6. Function to spawn the GLB model
            async function spawnModel(position) {
                const result = await BABYLON.SceneLoader.ImportMeshAsync(
                    "",
                    "./assets/",
                    "classic_mazda_miata_cabriolet__low_poly.glb",
                    scene
                );

                // Parent imported meshes under one transform node
                const modelRoot = new BABYLON.TransformNode(
                    "modelRoot",
                    scene
                );

                result.meshes.forEach(mesh => {
                    if (!mesh.parent) {
                        mesh.parent = modelRoot;
                    }
                });

                // Place model at the hit location
                modelRoot.position.copyFrom(position);

                // Adjust size if needed
                modelRoot.scaling.setAll(0.3);

                // Remember the newest model
                latestModel = modelRoot;
            }

            // 7. Initialize WebXR
            const xr = await scene.createDefaultXRExperienceAsync({
                uiOptions: {
                    sessionMode: "immersive-ar",
                    referenceSpaceType: "local-floor"
                },
                disableTeleportation: true
            });

            // 8. Detect controllers
            xr.input.onControllerAddedObservable.add(controller => {

                // Only use the right controller
                if (controller.inputSource.handedness !== "right") {
                    return;
                }

                controller.onMotionControllerInitObservable.add(
                    motionController => {

                        // Get right trigger
                        const trigger = motionController.getComponent(
                            "xr-standard-trigger"
                        );

                        if (!trigger) return;

                        // 9. Listen for trigger presses
                        trigger.onButtonStateChangedObservable.add(() => {

                            // Only respond to a new press
                            if (!trigger.changes.pressed ||
                                !trigger.pressed) {
                                return;
                            }

                            // 10. Create a ray from the controller
                            const ray = new BABYLON.Ray(
                                BABYLON.Vector3.Zero(),
                                BABYLON.Vector3.Forward(),
                                100
                            );

                            controller.getWorldPointerRayToRef(ray);

                            // 11. Test ray intersection with ground
                            const hit = scene.pickWithRay(
                                ray,
                                mesh => mesh === ground
                            );

                            // 12. Spawn model at hit location
                            if (hit && hit.hit && hit.pickedPoint) {
                                spawnModel(hit.pickedPoint);
                            }
                        });
                    }
                );
            });

            return scene;
        };

        // Start the scene
        createScene().then(scene => {
            engine.runRenderLoop(() => {
                scene.render();
            });
        }).catch(error => {
            console.error("Scene initialization failed:", error);
        });

        // Handle window resizing
        window.addEventListener("resize", () => {
            engine.resize();
        });
    </script>
</body>
</html>
